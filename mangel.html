<style>


.photoSty{
    height: 350px;
    margin: 20px;

}
.photoSty:hover{

}



#haloDisp{
    display: block;
    position: relative;
    margin: 20px;

	width: 310px;
	height: 310px;

    display: flex;
    align-items: center; /* Vertically centers the content */
    justify-content: center;

    margin-top: 40px;
	margin-bottom: 150px;
}
#halo{
    position: absolute;
    height: 200px;
    rotate: -11deg;

    z-index: 4;
    margin-top:-80px;
}
#hdr{
   position: absolute;
   height: 200px;
   width: 600px;

}

#feathers{
    position: absolute;
    height: 300px;

    margin-top: 200px;
}

body{
    font-family: "Lobster Two", sans-serif;
}

</style>
