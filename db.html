<script type="module">

    // 
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    const SUPA_URL = 'https://sjoejgimzoptridvexsx.supabase.co'
    const SUPA_KEY = 'sb_publishable_cVLw-qWhAo33zBV0wZGDZQ_swQp5pyz'
    const TABLE = 'test'                                    
    const supabase = createClient(SUPA_URL, SUPA_KEY)

// ---------------------------------------------------------------------------------------------------------------------------------

  // elements
  const listEl = document.getElementById('list')
  const input1 = document.getElementById('field1')
  const input2 = document.getElementById('field2')
  const btn = document.getElementById('addBtn')
  const msg = document.getElementById('msg')

    // read table function 
    async function load() {
      const res = document.getElementById('list')
      try {
        const { data, error } = await supabase.from(TABLE).select('text_field_1, tf2, justDate').order('id', { ascending: false })
        if (error) throw error
        res.innerHTML = (data || []).map(r => `<span>
            <span>${escapeHtml(String(r.text_field_1 ?? ''))}</span>
            <span>${escapeHtml(String(r.tf2 ?? ''))}</span>
            <span><sup>${escapeHtml(String(r.justDate ?? ''))}</sup></span><br>
        </span>`).join('') || '<li>(no rows)</li>'
      } catch (e) {
        res.textContent = 'Error: ' + (e.message || e)
        console.error(e)
      }
    }

    // escape helper
    function escapeHtml(s){ 
        return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]) 
    }

  // insert handler
  btn.addEventListener('click', async () => {
    const val1 = input1.value.trim()
    const val2 = input2.value.trim()
    if (!val1 && !val2) return (msg.textContent = 'Enter some data')

    try {
      const { data, error } = await supabase
        .from(TABLE)
        .insert([{ text_field_1: val1, tf2: val2 }])
        .select() // returns inserted row(s)
      if (error) throw error
      msg.textContent = 'Comment Sent!'
      // input1.value = ''
      input2.value = ''
      await load() // refresh list after insert
    } catch (e) {
      msg.textContent = 'Error: ' + (e.message || e)
      console.error(e)
    }
  })

    // initial load
    load()
  </script>
