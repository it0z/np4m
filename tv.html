<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" type="text/css" href="style.css">
<style>
body{
    font-family: "Lobster Two", sans-serif;
    margin: 0 auto;
}

.ytFrames{
    border: 2px solid black; 
    border-radius: 20px;
    width: 440px;
    height: 300px;
    margin: 10px;
}
</style>
</head>
<!------------------------------------------------------------------------------------------------- Body Start-->
<body>
<div id="topBanner">
	<!-- content loaded via JS -->
</div>
<div id="siteLogo">
	<!-- content loaded via JS -->	
</div>
<div id="clock1">clock space</div>
<center>
<br><br>
<h1 id="main_header">Mama Angel TV</h1>
<div id="disp">
</div>
</center>
<script>
const videoUrls = [
    'https://www.youtube.com/embed/fsYovsqTstI',
    'https://www.youtube.com/embed/8Er9Ar1enyw',
    'https://www.youtube.com/embed/NdvOH7vcmEA',
    'https://www.youtube.com/embed/pNQiRDM35TM',
    'https://www.youtube.com/embed/35vQH-LQzrU',
    'https://www.youtube.com/embed/k39MIbjI78U',
    'https://www.youtube.com/embed/PHw2bBe_9Uc'
];
const container = document.getElementById("disp");
videoUrls.forEach((url, i) => {
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.classList.add('ytFrames');   
    iframe.loading = 'lazy';  
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
    iframe.referrerpolicy = "strict-origin-when-cross-origin";
    iframe.allowfullscreen = true;
    container.appendChild(iframe);
});
</script>
<script src="script.js" defer></script>
<script>
document.title = "TV";
</script>
</body>
