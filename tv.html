const audio = document.getElementById('bg');
const cc2 = document.createElement('link');
let spell = '';
let fireon = false;

document.addEventListener('keyup', e => {
    const k = e.key;
    spell += k;
    document.title = spell;

    if(spell.includes("dark")){
        document.body.style.background = "black";
        spell = "";
