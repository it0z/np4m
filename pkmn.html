<style>
body{
    background-color: black;
}
img{
    height: 100px;
}
</style>
<div id="main_div">

</div>

<img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png">

<script>

let cnt = 0;



let pkmn = [
"https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png",
"https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/002.png"
];


for(let i = 0; i < pkmn.length; i++){
    main_div.innerHTML += "<img src='" + pkmn[i] + "''>";
    cnt++;

}

document.title = cnt;

</script>
